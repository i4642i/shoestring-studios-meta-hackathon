<style>

function drawSprite(c, frame) {
  const rows = BASE.concat(frame ? LEGS_A : LEGS_B);
  rows.forEach((row, y) => {
    [...row].forEach((ch, x) => {
      if (ch === ".") return;
      ctx.fillStyle = ch === "E" ? EYE : c.pal[ch];
      ctx.fillRect(c.x + x, c.y + y, 1, 1);
    });
  });
}

function drawRoom() {
  // 바닥 체크
  for (let y = 0; y < 210; y += 8)
    for (let x = 0; x < 320; x += 8) {
      ctx.fillStyle = ((x + y) / 8) % 2 ? "#b5854d" : "#a87844";
      ctx.fillRect(x, y, 8, 8);
    }
  // 벽 + 간판
  ctx.fillStyle = "#8f6a3f"; ctx.fillRect(0, 0, 320, 30);
  ctx.fillStyle = "#6b4a26"; ctx.fillRect(0, 30, 320, 3);
  ctx.fillStyle = "#ffe9c4"; ctx.font = "bold 11px monospace"; ctx.textAlign = "center";
  ctx.fillText("SHOESTRING STUDIOS", 160, 20);
  // 스토리보드
  ctx.fillStyle = "#f5f0e6"; ctx.fillRect(8, 5, 44, 22);
  ["#9aa3ad", "#2e7d6e", "#9aa3ad", "#9aa3ad", "#c2571b", "#9aa3ad"].forEach((col, i) => {
    ctx.fillStyle = col;
    ctx.fillRect(11 + (i % 3) * 13, 8 + Math.floor(i / 3) * 9, 10, 6);
  });
  // 러그 + 책상
  ctx.fillStyle = "#2e7d6e"; ctx.fillRect(95, 70, 130, 70);
  ctx.fillStyle = "#5b3a1e";
  ctx.fillRect(30, 110, 55, 26); ctx.fillRect(235, 110, 55, 26);
  ctx.fillStyle = "#8a5f33";
  ctx.fillRect(30, 110, 55, 5); ctx.fillRect(235, 110, 55, 5);
}

let tick = 0;
function newTarget(c) {
  c.tx = 20 + Math.random() * 270;
  c.ty = 45 + Math.random() * 130;
}
function loop() {
  tick++;
  drawRoom();
  crew.forEach((c, i) => {
    const dx = c.tx - c.x, dy = c.ty - c.y, d = Math.hypot(dx, dy);
    let moving = false;
    if (d > 2) {
      c.x += dx / d * 0.8; c.y += dy / d * 0.8; moving = true;
    } else if (Math.random() < 0.02) newTarget(c);
    if (i === 0 && pdSprite) {
      const bob = Math.sin(tick / 8) * 1.5;
      ctx.drawImage(pdSprite, c.x - 9, c.y - 16 + bob, 30, 30);
    } else drawSprite(c, moving ? Math.floor(tick / 8) % 2 === 0 : false);
    // 말풍선 동기화 (캔버스 320x210 → 표시 640x420 = 2배)
    const b = bubbles[i];
    b.style.left = (c.x * 2 - 30) + "px";
    b.style.top = (c.y * 2 - 70) + "px";
  });
  requestAnimationFrame(loop);
}
crew.forEach((c, i) => {
  bubbles[i].textContent = c.lines[0];
  newTarget(c);
  setInterval(() => { c.li = (c.li + 1) % c.lines.length; bubbles[i].textContent = c.lines[c.li]; }, 4000);
});
loop();
</script>
