<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Layout samples</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f6;--ink:#1f2937;--muted:#6b7280;--line:#d1d5db;--accent:#15803d}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",sans-serif}
header{padding:20px 24px 4px} h1{margin:0;font-size:20px} header p{margin:6px 0 0;color:var(--muted);font-size:13px}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(500px,1fr));gap:18px;padding:16px 24px 32px}
figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px}
.frame{position:relative;width:480px;height:270px;background:#f8fafc;border:1px solid var(--line);margin:0 auto;overflow:hidden}
.bgsvg{position:absolute;inset:0;width:100%;height:100%} .frame.cover{background:#fff} .frame.cover .slot{background:transparent !important} .frame.cover .num .c{color:#2E8AA3;font-size:80px !important;font-weight:900 !important}
.slot{position:absolute;box-sizing:border-box;border:1.5px dashed #94a3b8;border-radius:4px;display:flex;align-items:center;justify-content:center;text-align:center}
.slot .c{padding:4px;line-height:1.25} .slot.num .c{color:var(--accent)}
.tag{position:absolute;left:3px;top:2px;font-size:8.5px;color:#64748b;font-weight:600}
.kicker{position:absolute;left:24px;top:16px;font-size:10px;font-weight:700;border-left:3px solid var(--accent);padding-left:5px}
.src{position:absolute;left:24px;top:252px;font-size:8px;color:var(--muted)}
figcaption{display:grid;gap:3px;margin-top:8px;font-size:13px} figcaption span{color:#374151} figcaption small{color:var(--muted);font-size:11px}
</style></head><body>
<header><h1>13 layout samples</h1><p>Each 1280×720 screen is drawn at 3/8 size. Dashed boxes are slots, each labelled with its name, kind and size (aspect ratio). The texts and picture labels inside are real content from a test video.</p></header>
<main><figure><div class="frame"><div class="kicker">Misleading financial data</div><div class="src">Source: Advances in Financial Machine Learning, p. 10</div><div class="slot chart" style="left:24px;top:38px;width:432px;height:210px;background:#dbe8ff"><span class="tag">main · visual</span><div class="c" style="font-size:11px;font-weight:600">Prices and noise: 10-year line chart</div></div></div>
<figcaption><b>L01 Full-screen picture</b><span>One picture says everything the line says: a wide chart, a timeline, a wide photo</span><small>main 1152×560 (2.06:1)</small></figcaption></figure><figure><div class="frame"><div class="kicker">Today's first key point</div><div class="src">Source: Advances in Financial Machine Learning, p. 10</div><div class="slot text" style="left:60px;top:64px;width:360px;height:142px;background:#ffffff"><span class="tag">main · text</span><div class="c" style="font-size:15px;font-weight:800">Financial data is noisy and<br>short, so easily misleading</div></div></div>
<figcaption><b>L02 Big text in the middle</b><span>One key sentence, large; when text alone is enough, no material</span><small>main 960×380 (2.53:1)</small></figcaption></figure><figure><div class="frame"><div class="kicker">Medallion Fund</div><div class="src">Source: Advances in Financial Machine Learning, p. 10</div><div class="slot num" style="left:60px;top:49px;width:360px;height:112px;background:#ffffff"><span class="tag">main · number</span><div class="c" style="font-size:46px;font-weight:800">66%</div></div><div class="slot text" style="left:60px;top:169px;width:360px;height:56px;background:#ffffff"><span class="tag">text · text</span><div class="c" style="font-size:15px;font-weight:600">1988-2018 average yearly return</div></div></div>
<figcaption><b>L03 Big number + explanation</b><span>When one number is the point (a return, a ratio, a year)</span><small>main 960×300 (3.20:1) / text 960×150 (6.40:1)</small></figcaption></figure><figure><div class="frame"><div class="kicker">Explained in three steps</div><div class="src">Source: Advances in Financial Machine Learning, p. 10</div><div class="slot chart" style="left:24px;top:38px;width:432px;height:142px;background:#dbe8ff"><span class="tag">main · visual</span><div class="c" style="font-size:11px;font-weight:600">Route: misleading data → failing alone → dividing the work</div></div><div class="slot text" style="left:24px;top:188px;width:432px;height:60px;background:#ffffff"><span class="tag">text · text</span><div class="c" style="font-size:15px;font-weight:600">Why general AI doesn't work in finance</div></div></div>
<figcaption><b>L04 Picture on top + text below</b><span>A wide picture (ratio 2:1 or wider) with one or two lines of explanation</span><small>main 1152×380 (3.03:1) / text 1152×160 (7.20:1)</small></figcaption></figure><figure><div class="frame"><div class="kicker">Commuting investor</div><div class="src">Source: Advances in Financial Machine Learning, p. 10</div><div class="slot photo" style="left:24px;top:38px;width:225px;height:210px;background:#e6dfd3"><span class="tag">main · visual</span><div class="c" style="font-size:11px;font-weight:600">Photo: a laptop on the subway</div></div><div class="slot text" style="left:264px;top:38px;width:192px;height:210px;background:#ffffff"><span class="tag">text · text</span><div class="c" style="font-size:15px;font-weight:600">AI,<br>be used for investing<br>right away?</div></div></div>
<figcaption><b>L05 Picture left + text right</b><span>A portrait photo or square picture (ratio 1.4:1 or less) with an explanation</span><small>main 600×560 (1.07:1) / text 512×560 (0.91:1)</small></figcaption></figure><figure><div class="frame"><div class="kicker">Alone vs divided work</div><div class="src">Source: Advances in Financial Machine Learning, p. 10</div><div class="slot photo" style="left:24px;top:38px;width:210px;height:176px;background:#e6dfd3"><span class="tag">left · visual</span><div class="c" style="font-size:11px;font-weight:600">One person, every step</div></div><div class="slot photo" style="left:246px;top:38px;width:210px;height:176px;background:#e6dfd3"><span class="tag">right · visual</span><div class="c" style="font-size:11px;font-weight:600">A factory with shared tasks</div></div><div class="slot text" style="left:24px;top:221px;width:210px;height:26px;background:#ffffff"><span class="tag">left_label · text</span><div class="c" style="font-size:15px;font-weight:600">Alone: only fake strategies remain</div></div><div class="slot text" style="left:246px;top:221px;width:210px;height:26px;background:#ffffff"><span class="tag">right_label · text</span><div class="c" style="font-size:15px;font-weight:600">Divided work: small signals add up</div></div></div>
<figcaption><b>L06 Side-by-side comparison</b><span>Comparing two things (before and after, A and B)</span><small>left 560×470 (1.19:1) / right 560×470 (1.19:1) / left_label 560×70 (8.00:1) / right_label 560×70 (8.00:1)</small></figcaption></figure><figure><div class="frame"><div class="kicker">An automated investing service</div><div class="src">Source: Advances in Financial Machine Learning, p. 10</div><div class="slot chart" style="left:24px;top:38px;width:432px;height:124px;background:#dbe8ff"><span class="tag">main · visual</span><div class="c" style="font-size:11px;font-weight:600">Timeline: introduced 2016 → reviewed 2023</div></div><div class="slot photo" style="left:24px;top:169px;width:210px;height:79px;background:#e6dfd3"><span class="tag">sub1 · visual</span><div class="c" style="font-size:11px;font-weight:600">App screen</div></div><div class="slot num" style="left:246px;top:169px;width:210px;height:79px;background:#ffffff"><span class="tag">sub2 · visual</span><div class="c" style="font-size:46px;font-weight:600">7 years</div></div></div>
<figcaption><b>L07 Big main element on top + two supports below</b><span>A wide main picture with two small pieces of evidence (photo, number)</span><small>main 1152×330 (3.49:1) / sub1 560×210 (2.67:1) / sub2 560×210 (2.67:1)</small></figcaption></figure><figure><div class="frame"><div class="kicker">Research factory</div><div class="src">Source: Advances in Financial Machine Learning, p. 10</div><div class="slot chart" style="left:24px;top:38px;width:278px;height:210px;background:#dbe8ff"><span class="tag">main · visual</span><div class="c" style="font-size:11px;font-weight:600">Diagram: data → signal → test → execution</div></div><div class="slot num" style="left:314px;top:38px;width:142px;height:101px;background:#ffffff"><span class="tag">sub1 · visual</span><div class="c" style="font-size:46px;font-weight:600">4 steps</div></div><div class="slot photo" style="left:314px;top:146px;width:142px;height:101px;background:#e6dfd3"><span class="tag">sub2 · visual</span><div class="c" style="font-size:11px;font-weight:600">Factory photo</div></div></div>
<figcaption><b>L08 Big main element left + two supports right</b><span>A near-square main picture with two small pieces of evidence</span><small>main 740×560 (1.32:1) / sub1 380×270 (1.41:1) / sub2 380×270 (1.41:1)</small></figcaption></figure><figure><div class="frame"><div class="kicker">Three key points</div><div class="src">Source: Advances in Financial Machine Learning, p. 10</div><div class="slot card" style="left:24px;top:52px;width:138px;height:180px;background:#eef6f1"><span class="tag">a · card</span><div class="c" style="font-size:14px;font-weight:800">① Noisy<br>Short data</div></div><div class="slot card" style="left:171px;top:52px;width:138px;height:180px;background:#eef6f1"><span class="tag">b · card</span><div class="c" style="font-size:14px;font-weight:800">② Working alone<br>Fake strategies</div></div><div class="slot card" style="left:318px;top:52px;width:138px;height:180px;background:#eef6f1"><span class="tag">c · card</span><div class="c" style="font-size:14px;font-weight:800">③ Divide the work<br>Small signals</div></div></div>
<figcaption><b>L09 Three slots side by side</b><span>Three items of equal weight (steps, reasons, cases)</span><small>a 368×480 (0.77:1) / b 368×480 (0.77:1) / c 368×480 (0.77:1)</small></figcaption></figure><figure><div class="frame"><div class="kicker">The Medallion story</div><div class="src">Source: Advances in Financial Machine Learning, p. 10</div><div class="slot seq" style="left:24px;top:38px;width:432px;height:210px;background:#fdf1d6"><span class="tag">main · visual · in sequence</span><div class="c" style="font-size:11px;font-weight:600">Photo → 66% → diagram (one by one, with the line)</div></div></div>
<figcaption><b>L10 One slot, one after another</b><span>Showing 2-4 materials one by one, in step with the line</span><small>main 1152×560 (2.06:1)</small></figcaption></figure><figure><div class="frame"><div class="kicker">The power of division of labor</div><div class="src">Source: Advances in Financial Machine Learning, p. 10</div><div class="slot chart" style="left:24px;top:38px;width:278px;height:210px;background:#dbe8ff"><span class="tag">main · visual</span><div class="c" style="font-size:11px;font-weight:600">Diagram: research factory</div></div><div class="slot seq" style="left:314px;top:38px;width:142px;height:210px;background:#fdf1d6"><span class="tag">side · visual · in sequence</span><div class="c" style="font-size:11px;font-weight:600">Evidence 1 → evidence 2 → evidence 3</div></div></div>
<figcaption><b>L11 Main element fixed + supports one after another</b><span>The main picture stays while evidence is added one by one</span><small>main 740×560 (1.32:1) / side 380×560 (0.68:1)</small></figcaption></figure><figure><div class="frame"><div class="kicker">Original text</div><div class="src">Source: Advances in Financial Machine Learning, p. 10</div><div class="slot quote" style="left:60px;top:60px;width:360px;height:120px;background:#ffffff"><span class="tag">main · text</span><div class="c" style="font-size:14px;font-weight:600">“Overfitting is unethical. It promises<br>results that cannot be reproduced.”</div></div><div class="slot text" style="left:60px;top:188px;width:360px;height:30px;background:#ffffff"><span class="tag">cite · text</span><div class="c" style="font-size:15px;font-weight:600">Marcos López de Prado, 2018, p. 10</div></div></div>
<figcaption><b>L12 Quote + source</b><span>Showing one or two sentences of the original text as they are</span><small>main 960×320 (3.00:1) / cite 960×80 (12.00:1)</small></figcaption></figure><figure><div class="frame cover"><svg class="bgsvg" viewBox="0 0 1280 720" preserveAspectRatio="none"><polygon points="0,0 199,0 944,720 0,720" fill="#DDF1F6"/><polygon points="514,0 1120,0 1280,247 1280,411" fill="#EADDEB"/><polygon points="1120,0 1280,0 1280,247" fill="#F6DCE3"/></svg><div class="slot text" style="left:30px;top:75px;width:225px;height:71px;background:#ffffff"><span class="tag">title · text</span><div class="c" style="font-size:15px;font-weight:800">Why general AI<br>doesn't work</div></div><div class="slot text" style="left:30px;top:155px;width:225px;height:38px;background:#ffffff"><span class="tag">subtitle · text</span><div class="c" style="font-size:15px;font-weight:600">used as is, it fails</div></div><div class="slot num" style="left:262px;top:52px;width:172px;height:128px;background:#ffffff"><span class="tag">number · number</span><div class="c" style="font-size:46px;font-weight:600">01</div></div></div>
<figcaption><b>L13 Section cover</b><span>The cover the program shows automatically during the first 3 s of a part's first cut (the screen designer does not choose it): a big part number (01, 02...), the part title and one line of explanation. Background: soft diagonal shapes (light cyan on the left, light purple and light pink triangles at the top right)</span><small>title 600×190 (3.16:1) / subtitle 600×100 (6.00:1) / number 460×340 (1.35:1)</small></figcaption></figure></main></body></html>
