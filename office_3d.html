      blocks.push({ x0: it.x - w / 2, x1: it.x + w / 2, z0: it.z - d / 2, z1: it.z + d / 2 });
    } else if (it.block) {
      const pad = 0.1;

    -((e.clientY - rect.top) / rect.height) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(crew.map((m) => m.group), true);
  if (hits.length) {
    let o = hits[0].object;
    while (o && o.userData.memberIndex === undefined) o = o.parent;
    if (o) followed = crew[o.userData.memberIndex];
  } else followed = null;
});
// Studio chat speaks through the member's bubble (postMessage from index.html).
addEventListener("message", (e) => {
  if (e.origin !== location.origin) return;
  const d = e.data;
  if (!d || (d.kind !== "crew-say" && d.kind !== "crew-chat")) return;
  const m = crew.find((x) => x.emp.id === d.id) || crew[0];
  if (!m) return;
  const now = performance.now();
  if (d.kind === "crew-chat") {
    // Walk to own desk and sit while the user chats.
    m.chatAt = now;
    setBubble(m, "CHATTING");
    if (m.state !== "sit" && m.seat) {
      const p = m.group.position;
      m.target = { x: m.seat.x, z: m.seat.z };
      m.route = findPath(p.x, p.z, m.seat.x, m.seat.z) || [m.target];
      m.seatTrip = true;
      m.replanned = false;
      m.stuckAt = now;
      m.stuckPos = { x: p.x, z: p.z };
      m.state = "walk";
      fadeTo(m, "walk");
    }
    return;
  }
  if (typeof d.text !== "string" || !d.text) return;
  setBubble(m, d.text.slice(0, 140));
  m.chatAt = now;
  m.bubbleAt = now + 8000;
});
function sizeRenderer() {
  const w = container.clientWidth, h = container.clientHeight;
  if (w < 2 || h < 2) return false; // hidden: ResizeObserver refires on show
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setSize(w, h);
  return true;
}
function refit() {
  if (!sizeRenderer()) return;
  fitCamera();
}
if (typeof ResizeObserver !== "undefined")
  new ResizeObserver(refit).observe(container);
addEventListener("resize", refit);
refit();

/* ================= main loop + boot ================= */
const timer = new THREE.Timer();
timer.connect(document);
const followPoint = new THREE.Vector3();
function animate() {
  requestAnimationFrame(animate);
  timer.update();
  const dt = Math.min(timer.getDelta(), 0.05);
  const now = performance.now();
  blinkLeds(now);
  updateCrew(dt, now);
  if (followed) {
    followPoint.set(followed.group.position.x,
      followed.group.position.y + 0.55 * followed.charS, followed.group.position.z);
    controls.target.lerp(followPoint, 1 - Math.exp(-3 * dt));
  } else if (camTween) {
    const k = clamp(1 - (camTween.until - now) / 800, 0, 1);
    const e = k * k * (3 - 2 * k);
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (k >= 1) { camTween = null; fitCamera(); }
  }
  controls.target.x = clamp(controls.target.x, ALL.x0, ALL.x1);
  controls.target.y = clamp(controls.target.y, 0, 2.5);
  controls.target.z = clamp(controls.target.z, ALL.z0, ALL.z1);
  controls.update();
  renderer.render(scene, camera);
}
(async function boot() {
  buildRoom();
  buildServerRoom();
  animate(); // live frame loop from the first paint; assets pop in as they load
  await buildFurniture();
  buildGrid();
  await spawnCrew();
  $("loading").style.display = "none";
  $("error").style.display = "none";
  window.__officeReady = true;
  window.__officeStatus = {
    crew: crew.length,
    story: crew.filter((m) => m.emp.team === "story").length,
    video: crew.filter((m) => m.emp.team === "video").length,
    desks: { story: deskSeats.story.length, video: deskSeats.video.length },
    desksOk: crew.length > 0 && crew.every((m) => m.seat)
      && deskSeats.story.length >= crew.filter((m) => m.emp.team === "story").length
      && deskSeats.video.length >= crew.filter((m) => m.emp.team === "video").length,
    doorwaysClear: doorwaysClear(),
  };
  booted = true;
})().catch((e) => showError("Boot failed.", String((e && e.message) || e)));



</script>
